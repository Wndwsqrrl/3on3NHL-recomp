org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Path to the rexglue-sdk checkout, resolved relative to this android/ project
# directory (rootProject dir). The app needs it for two things:
#   1. the CMake tree it cross-compiles (via -DREXSDK_DIR)
#   2. the bundled SDL3 Android Java sources (org.libsdl.app.*)
# In this working tree the SDK is a sibling of the game repo, so it is two
# levels up. Adjust if your rexglue-sdk lives elsewhere.
rexSdkDir=../../rexglue-sdk
